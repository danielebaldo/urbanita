      <!DOCTYPE html>
      <html lang="en">
      <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Urbanita — Explore the world's cities</title>
      <style>
        :root {
          --bg: #faf9f7;
          --ink: #1a1a1a;
          --muted: #6b6b6b;
          --accent: #c2410c;
          --card: #ffffff;
          --border: #e5e3df;
        }
        * { box-sizing: border-box; }
        body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          background: var(--bg);
          color: var(--ink);
          line-height: 1.6;
        }
        header {
          padding: 3rem 1.5rem 2rem;
          text-align: center;
        }
        h1 {
          font-size: 2.75rem;
          margin: 0 0 .5rem;
          letter-spacing: -0.02em;
        }
        .tagline { color: var(--muted); margin: 0; }
        main { max-width: 680px; margin: 0 auto; padding: 0 1.5rem 4rem; }
        form { display: flex; gap: .5rem; margin-bottom: 2rem; }
        input[type=search] {
          flex: 1;
          padding: .85rem 1rem;
          font-size: 1rem;
          border: 1px solid var(--border);
          border-radius: 8px;
          background: var(--card);
        }
        input[type=search]:focus {
          outline: 2px solid var(--accent);
          outline-offset: -1px;
        }
        button {
          padding: .85rem 1.5rem;
          font-size: 1rem;
          border: none;
          border-radius: 8px;
          background: var(--accent);
          color: white;
          cursor: pointer;
        }
        button:hover { opacity: .9; }
        .card {
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 1.5rem;
          margin-bottom: 1rem;
        }
        .card h2 { margin: 0 0 .25rem; font-size: 1.5rem; }
        .desc { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
        .card img {
          float: right;
          margin: 0 0 1rem 1rem;
          border-radius: 8px;
          max-width: 180px;
        }
        .meta {
          font-size: .875rem;
          color: var(--muted);
          border-top: 1px solid var(--border);
          padding-top: 1rem;
          margin-top: 1rem;
          clear: both;
        }
        .meta a { color: var(--accent); }
        .options li { margin-bottom: .75rem; }
        .options a { color: var(--accent); font-weight: 500; text-decoration: none; }
        .options a:hover { text-decoration: underline; }
        .options span { display: block; color: var(--muted); font-size: .875rem; }
        .status { color: var(--muted); font-style: italic; }
        .error { color: #b91c1c; }
      </style>
      </head>
      <body>

      <header>
        <h1>Urbanita</h1>
        <p class="tagline">Type a city. Learn something.</p>
      </header>

      <main>
        <form id="search-form">
          <input type="search" id="city-input" placeholder="Lisbon, Osaka, Valparaíso…"
                 autocomplete="off" required>
          <button type="submit">Search</button>
        </form>

        <div id="results" aria-live="polite"></div>
      </main>

      <script>
      const API = 'https://en.wikipedia.org/api/rest_v1/page/summary/';
      const SEARCH = 'https://en.wikipedia.org/w/api.php';

      const form = document.getElementById('search-form');
      const input = document.getElementById('city-input');
      const results = document.getElementById('results');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const query = input.value.trim();
        if (!query) return;
        await lookup(query);
      });

      async function lookup(query) {
        results.innerHTML = '<p class="status">Looking up…</p>';

        try {
          const res = await fetch(API + encodeURIComponent(query), {
            headers: { 'Accept': 'application/json' }
          });

          if (res.status === 404) {
            return showSearchOptions(query, "No exact match found.");
          }
          if (!res.ok) throw new Error('HTTP ' + res.status);

          const data = await res.json();

          if (data.type === 'disambiguation') {
            return showSearchOptions(query, "That name matches several places.");
          }

          renderCity(data);

        } catch (err) {
          results.innerHTML = `<p class="error">Something went wrong: ${err.message}</p>`;
        }
      }

      function renderCity(data) {
        const img = data.thumbnail
          ? `<img src="${data.thumbnail.source}" alt="${escapeHtml(data.title)}">`
          : '';

        const coords = data.coordinates
          ? `<br>Coordinates: ${data.coordinates.lat.toFixed(3)}, ${data.coordinates.lon.toFixed(3)}`
          : '';

        results.innerHTML = `
          <article class="card">
            ${img}
            <h2>${escapeHtml(data.title)}</h2>
            ${data.description ? `<p class="desc">${escapeHtml(data.description)}</p>` : ''}
            <p>${escapeHtml(data.extract || 'No summary available.')}</p>
            <div class="meta">
              Source: <a href="${data.content_urls.desktop.page}" target="_blank" rel="noopener">
                Wikipedia — ${escapeHtml(data.title)}</a>
              ${coords}
            </div>
          </article>`;
      }

      async function showSearchOptions(query, message) {
        const params = new URLSearchParams({
          action: 'query',
          list: 'search',
          srsearch: query,
          srlimit: '8',
          format: 'json',
          origin: '*'
        });

        const res = await fetch(SEARCH + '?' + params);
        const data = await res.json();
        const hits = data.query.search;

        if (!hits.length) {
          results.innerHTML = `<p class="error">Nothing found for "${escapeHtml(query)}".</p>`;
          return;
        }

        const items = hits.map(h => `
          <li>
            <a href="#" data-title="${escapeHtml(h.title)}">${escapeHtml(h.title)}</a>
            <span>${stripTags(h.snippet)}</span>
          </li>`).join('');

        results.innerHTML = `
          <div class="card">
            <p class="desc">${escapeHtml(message)} Did you mean:</p>
            <ul class="options">${items}</ul>
          </div>`;

        results.querySelectorAll('a[data-title]').forEach(a => {
          a.addEventListener('click', (e) => {
            e.preventDefault();
            const title = a.getAttribute('data-title');
            input.value = title;
            lookup(title);
          });
        });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, c =>
          ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      }

      function stripTags(s) {
        const d = document.createElement('div');
        d.innerHTML = s;
        return d.textContent;
      }
      </script>

      </body>
      </html>
